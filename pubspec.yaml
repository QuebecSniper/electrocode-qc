name: electrocode_qc
description: Dimensionnement électrique hors-ligne pour électriciens du Québec.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  electrocode_engine:
    path: packages/electrocode_engine
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.1.5
  file_picker: ^8.1.7
  image_picker: ^1.1.2
  speech_to_text: ^7.0.0
  google_mlkit_text_recognition: ^0.15.0
  pdf: ^3.11.3
  printing: ^5.13.4
  share_plus: ^10.1.4
  uuid: ^4.5.1
  intl: ^0.19.0
  path: ^1.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
